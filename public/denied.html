<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>米萌标题智能运营 — 申请权限</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:#fff;border-radius:12px;padding:40px;width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.3);text-align:center}
.box .icon{font-size:48px;margin-bottom:12px}
.box h1{font-size:20px;color:#1a1a2e;margin-bottom:6px}
.box .user{background:#f5f5f5;border-radius:8px;padding:12px;margin-bottom:16px;font-size:15px;line-height:1.8}
.box p{font-size:14px;color:#666;margin-bottom:20px;line-height:1.6}
.box .btn{padding:10px 32px;background:#e53935;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer}
.box .btn:disabled{background:#ccc;cursor:not-allowed}
.box .btn.success{background:#4caf50}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #e0e0e0;border-top-color:#e53935;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box" id="main-box">
  <div class="icon">🔒</div>
  <h1 id="title">暂无访问权限</h1>
  <div class="user" id="user-info">加载中...</div>
  <p id="msg-text">如需使用该功能，请提交申请。</p>
  <button class="btn" id="btn-apply" onclick="apply()">申请访问权限</button>
</div>
<script>
var params=new URLSearchParams(location.search);
var userName=params.get('user')||'—';
var openId=params.get('openId')||'';
var department=params.get('dept')||'';
document.getElementById('user-info').innerHTML='<strong>'+userName+'</strong>'+(department?'<br>部门：'+department:'');

async function apply(){
  var btn=document.getElementById('btn-apply');
  btn.disabled=true;btn.textContent='提交中...';
  try{
    var r=await fetch('/api/auth/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({openId:openId,userName:userName,department:department})});
    var d=await r.json();
    if(d.ok && d.message.indexOf('已审批通过')>=0){
      document.getElementById('title').textContent='已有权限';
      document.getElementById('msg-text').textContent='即将跳转...';
      document.getElementById('btn-apply').style.display='none';
      setTimeout(function(){location.href='/'},1500);
      return;
    }
    if(d.ok){
      document.getElementById('btn-apply').className='btn success';btn.textContent='已提交申请';btn.disabled=true;
      document.getElementById('msg-text').innerHTML='<span class="spinner"></span> 等待管理员审批...';
      startPolling();
    }else{
      btn.disabled=false;btn.textContent='申请访问权限';
    }
  }catch(e){btn.disabled=false;btn.textContent='申请访问权限'}
}

function startPolling(){
  setTimeout(async function poll(){
    try{
      var r=await fetch('/api/auth/status?openId='+encodeURIComponent(openId));
      if(!r.ok) throw new Error();
      var d=await r.json();
      if(d.approved){
        document.getElementById('title').textContent='审批已通过';
        document.getElementById('msg-text').textContent='即将跳转...';
        document.getElementById('btn-apply').style.display='none';
        setTimeout(function(){location.href='/'},1500);
        return;
      }
    }catch(e){}
    setTimeout(poll,5000);
  },5000);
}
</script>
</body></html>
